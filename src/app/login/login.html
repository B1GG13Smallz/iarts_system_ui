<main class="login-shell">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-copy">
      <h1 id="login-title">Sign in to IARTS</h1>
    </div>

    <form class="login-form" (ngSubmit)="submitLogin()" #loginForm="ngForm">
      <mat-form-field appearance="outline">
        <span class="material-symbols-outlined login-field-icon" matPrefix aria-hidden="true">account_circle</span>
        <input
          matInput
          autocomplete="username"
          name="username"
          placeholder="Enter username"
          required
          type="text"
          [(ngModel)]="username"
        />
        <mat-hint>User name</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <span class="material-symbols-outlined login-field-icon" matPrefix aria-hidden="true">lock</span>
        <input
          matInput
          autocomplete="current-password"
          name="password"
          placeholder="Enter password"
          required
          [type]="showPassword() ? 'text' : 'password'"
          [(ngModel)]="password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          class="password-toggle"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
          (click)="togglePasswordVisibility()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">
            {{ showPassword() ? 'visibility_off' : 'visibility' }}
          </span>
        </button>
        <mat-hint>Password</mat-hint>
      </mat-form-field>

      @if (loginError()) {
        <p class="login-error" role="alert">{{ loginError() }}</p>
      }

      <button mat-raised-button class="login-button" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in' : 'Sign in' }}
      </button>
    </form>
  </section>

  <section class="login-context" aria-label="System context">
  </section>
</main>
